{% set name = "spikingjelly" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/spikingjelly-{{ version }}.tar.gz
  sha256: f9b9940c3675f9e7bf10484d37ecb27367aba8379233dc8c6e4d590fafac62ae

build:
  script: cp $RECIPE_DIR/fake_requirements.txt ./requirements.txt && {{ PYTHON }} -m pip install . -vv --no-deps
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - matplotlib-base
    - numpy
    - onnx
    - python >={{ python_min }}
    - scipy
    - pytorch >=1.5.0
    - torchvision
    - tqdm
    - cupy

test:
  imports:
    - spikingjelly
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fangwei123456/spikingjelly
  summary: A deep learning framework for SNNs built on PyTorch.
  license: LicenseRef-NOASSERTION
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
